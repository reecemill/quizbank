{% extends "bank/base.html" %}
{% load static %}

{% block title %}Sign In{% endblock %}

{% block body %}
  <main class="login">
    <div class="login-card" data-spotlight>
      <img class="login-icon" src="{% static 'bank/icon.svg' %}" alt="" width="72" height="72">
      <h1 class="login-title">QuizBank</h1>
      <p class="login-sub">Sign in to your question bank</p>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% if form.errors %}
          <p class="form-error" role="alert">That username and password don't match. Try again.</p>
        {% endif %}
        <div class="list list--form">
          <label class="row field">
            <span class="visually-hidden">Username</span>
            <input type="text" name="username" value="{{ form.username.value|default:'' }}" placeholder="Username"
                   autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
          </label>
          <label class="row field">
            <span class="visually-hidden">Password</span>
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
          </label>
        </div>
        <button class="button button--filled button--large button--block" type="submit">Sign In</button>
      </form>
    </div>
  </main>
{% endblock %}
