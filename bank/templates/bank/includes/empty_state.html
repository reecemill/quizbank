{% comment %}
Usage: {% include "bank/includes/empty_state.html" with icon="bank/icons/school.svg" title="…" text="…" action_url=url action_label="…" %}
{% endcomment %}
<div class="empty-state">
  <div class="empty-icon">{% include icon %}</div>
  <h2 class="empty-title">{{ title }}</h2>
  {% if text %}<p class="empty-text">{{ text }}</p>{% endif %}
  {% if action_url %}<a class="button button--filled" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
</div>
